<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/pixora-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#2563eb" />
  <title>Pixora 智繪</title>
  <script>
    /* 在首次繪製前套用主題，避免重新整理時閃現錯誤色系。 */
    (function () {
      var stored = localStorage.getItem("pixora.theme");
      var theme = stored === "light" || stored === "dark"
        ? stored
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.classList.toggle("dark", theme === "dark");
      document.documentElement.style.colorScheme = theme;
      /* 狀態列顏色對齊頂部的主色頁首；值與 src/lib/theme.js 的 THEME_COLORS 相同。 */
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#3b82f6" : "#2563eb";
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
